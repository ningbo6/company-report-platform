services:
  forward:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    user: "101:101"
    network_mode: host
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/run:mode=1777
      - /var/cache/nginx:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
