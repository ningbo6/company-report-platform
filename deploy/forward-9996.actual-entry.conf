worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 512; }
stream {
    log_format relay '$remote_addr [$time_local] $status $bytes_sent $bytes_received $session_time upstream=$upstream_addr';
    access_log /dev/stdout relay;
    server {
        listen 10.9.0.90:18888;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
        proxy_pass 10.9.0.98:18888;
    }
}
