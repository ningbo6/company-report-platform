events {}
stream {
    map $ssl_preread_protocol $query_backend {
        "" 127.0.0.1:28887;
        default 127.0.0.1:28888;
    }
    server {
        listen 10.9.0.98:18888;
        ssl_preread on;
        proxy_pass $query_backend;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }
}
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=reports_ip:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=reports_conn:10m;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server {
        listen 127.0.0.1:28887 proxy_protocol;
        listen 127.0.0.1:28888 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        server_name 10.9.0.98;
        client_max_body_size 1k;
        limit_req zone=reports_ip burst=20 nodelay;
        limit_req_status 429;
        limit_conn reports_conn 4;
        location / {
            proxy_pass http://127.0.0.1:19888;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_hide_header Set-Cookie;
            proxy_read_timeout 60s;
            max_ranges 1;
        }
    }
    server {
        listen 10.9.0.98:18889 ssl;
        server_name 10.9.0.98;
        allow 10.0.101.63;
        allow 10.9.0.98;
        deny all;
        client_max_body_size 1g;
        client_body_timeout 60s;
        location / {
            proxy_pass http://127.0.0.1:19889;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
