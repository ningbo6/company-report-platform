services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${HTTP_PORT:-18889}:18880"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./backups:/app/backups
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=1200m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18880/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  public:
    extends:
      service: app
    depends_on:
      app:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:${PUBLIC_HTTP_PORT:-18888}:18880"
    command: ["uvicorn", "library.main:create_public_app", "--factory", "--host", "0.0.0.0", "--port", "18880", "--workers", "1", "--no-server-header", "--no-proxy-headers"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18880/static/style.css', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
